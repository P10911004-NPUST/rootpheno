[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "rootpheno"
version = "0.0.2"
authors = [
  { name="jklai", email="p10911004@gmail.com" },
]
description = "A Python toolkit for plant root phenotyping."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/P10911004-NPUST/rootpheno"
Issues = "https://github.com/P10911004-NPUST/rootpheno/issues"
